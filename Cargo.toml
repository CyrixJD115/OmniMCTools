[workspace]
resolver = "2"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"

[workspace.dependencies]
omt-nbt = { path = "crates/omt-nbt" }
omt-world = { path = "crates/omt-world" }
omt-versions = { path = "crates/omt-versions" }
omt-bedrock = { path = "crates/omt-bedrock" }
omt-java = { path = "crates/omt-java" }
omt-convert = { path = "crates/omt-convert" }
omt-prune = { path = "crates/omt-prune" }
omt-render = { path = "crates/omt-render" }
omt-art = { path = "crates/omt-art" }
omt-texpack = { path = "crates/omt-texpack" }
omt-edit = { path = "crates/omt-edit" }
omt-gpu = { path = "crates/omt-gpu" }
omt-script = { path = "crates/omt-script" }
omt-cli = { path = "crates/omt-cli" }
omt-gui = { path = "crates/omt-gui" }

flate2 = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
clap = { version = "4", features = ["derive"] }
iced = { version = "0.14", features = ["canvas", "image", "tokio"] }
bedrock-leveldb = "0.3"
crc32fast = "1"
rfd = "0.17"
zip = { version = "4", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Vendored (MIT OR Apache-2.0) with an OMT patch: flush writes ~2 MiB
# sorted tables instead of one whole-database table — see vendor/bedrock-leveldb/OMT_PATCH.md.
[patch.crates-io]
bedrock-leveldb = { path = "vendor/bedrock-leveldb" }
# Vendored (MIT) with an OMT patch: images honor the layer clip — see
# vendor/iced_tiny_skia/OMT_PATCH.md.
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
# Vendored (MIT) with an OMT patch: pointer lock + raw mouse motion for 3D
# mouse-look — see vendor/iced_winit/OMT_PATCH.md.
iced_winit = { path = "vendor/iced_winit" }
