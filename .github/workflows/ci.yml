name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test-clippy:
    name: ${{ matrix.os }} — build / test / clippy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Fixture-gated tests are #[ignore]d (they read env-var-gated world
      # paths); CI runs the plain suite — no fixtures or secrets needed.
      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Cheap compile-only check that the fuzz targets stay valid; fuzzing itself
  # never runs in CI (needs nightly + libFuzzer, campaigns stay local).
  fuzz-build:
    name: nightly — build fuzz targets (compile only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz

      - name: Build fuzz targets (no run)
        run: cargo fuzz build
        working-directory: fuzz
